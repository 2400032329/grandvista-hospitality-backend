spring.application.name=api-gateway

server.port=8090

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway Discovery
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Room Service Route
spring.cloud.gateway.server.webflux.routes[0].id=room-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ROOM-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/room-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/room-service/(?<segment>.*), /${segment}

# Booking Service Route
spring.cloud.gateway.server.webflux.routes[1].id=booking-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/booking-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/booking-service/(?<segment>.*), /${segment}

# Payment Service Route
spring.cloud.gateway.server.webflux.routes[2].id=payment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/payment-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/payment-service/(?<segment>.*), /${segment}

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/auth-service/(?<segment>.*), /${segment}
